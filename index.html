<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Price Tracker · Skyblock Market Dashboard</title>
  <style>
    :root{
      --bg:#0a0c11; --panel:#11141b; --panel2:#171b24; --hover:#1b2030; --line:#222838; --line2:#2b3246;
      --text:#e9ecf3; --muted:#8a92a6; --faint:#5d6478;
      --accent:#f5b942; --accent-ink:#1a1405; --green:#34d399; --red:#f87171; --blue:#60a5fa; --violet:#a78bfa;
      --shadow:0 10px 40px rgba(0,0,0,.45); --radius:12px;
    }
    [data-theme="light"]{
      --bg:#f4f5f8; --panel:#ffffff; --panel2:#f1f3f8; --hover:#eef1f7; --line:#e3e6ee; --line2:#d3d8e4;
      --text:#151925; --muted:#69728a; --faint:#98a0b4;
      --accent:#d99a12; --accent-ink:#ffffff; --green:#0f9d6b; --red:#d9443f; --blue:#2563eb; --violet:#7c5cd6;
      --shadow:0 10px 40px rgba(20,30,60,.14);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{background:var(--bg);color:var(--text);font:14px/1.45 "Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    .ic{flex-shrink:0;vertical-align:middle}
    .app{display:flex;height:100%}

    /* ---------- sidebar ---------- */
    .side{width:244px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;flex-shrink:0;z-index:30}
    .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
    .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#e0742c);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;letter-spacing:.5px}
    .brand b{display:block;font-size:15px}
    .brand small{color:var(--muted);font-size:12px}
    .navsec{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
    .nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--muted);font-weight:600;border:0;background:none;width:100%;text-align:left}
    .nav:hover{background:var(--hover);color:var(--text)}
    .nav.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
    .nav .badge{margin-left:auto;font-size:11px;background:var(--panel2);color:var(--muted);padding:1px 8px;border-radius:20px;font-weight:700}
    .nav.on .badge{color:var(--accent)}
    .side-foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}

    /* ---------- main ---------- */
    .main{flex:1;min-width:0;display:flex;flex-direction:column}
    .top{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
    .gsearch{position:relative;flex:1;max-width:520px}
    .gsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
    .gsearch input{width:100%;padding:10px 12px 10px 38px;background:var(--panel);border:1px solid var(--line);border-radius:10px;outline:none}
    .gsearch input:focus,.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
    .pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block}
    .dot.live{background:var(--green);box-shadow:0 0 0 0 var(--green);animation:pulse 2s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
    .icon-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
    .icon-btn:hover{color:var(--text);background:var(--hover)}
    .menu{display:none}
    #view{padding:24px;overflow-y:auto;flex:1}
    .page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
    h1{margin:0;font-size:24px;letter-spacing:-.01em}
    h2{margin:0;font-size:15px}
    .sub{color:var(--muted);margin:4px 0 0}
    .banner{background:color-mix(in srgb,var(--red) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--red) 40%,var(--line));color:var(--red);padding:10px 14px;border-radius:10px;margin-bottom:16px;font-weight:600}

    /* ---------- components ---------- */
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
    .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
    .card-h h2{display:flex;align-items:center;gap:8px}
    .card-b{padding:16px}
    .grid{display:grid;gap:14px}
    .stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
    .stat{padding:16px}
    .stat .l{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
    .stat .v{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.02em}
    .stat .s{color:var(--faint);font-size:12px;margin-top:2px}
    .cols2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
    .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
    .seg button{border:0;background:none;color:var(--muted);padding:6px 14px;border-radius:7px;font-weight:600}
    .seg button.on{background:var(--accent);color:var(--accent-ink)}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:5px 12px;border-radius:20px;font-weight:600;font-size:12.5px}
    .chip:hover{color:var(--text);background:var(--hover)}
    .chip.on{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
    .chip i{font-style:normal;opacity:.7;margin-left:5px}
    .field{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none;min-width:0}
    textarea.field{width:100%;min-height:130px;resize:vertical}
    .btn{border:0;background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:9px;font-weight:700}
    .btn:hover{filter:brightness(1.08)}
    .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
    .btn.ghost:hover{background:var(--hover)}
    .btn.sm{padding:6px 12px;font-size:12.5px}
    .btn.danger{background:color-mix(in srgb,var(--red) 16%,var(--panel2));color:var(--red);border:1px solid color-mix(in srgb,var(--red) 35%,var(--line))}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .muted{color:var(--muted)} .faint{color:var(--faint)} .num{text-align:right;font-variant-numeric:tabular-nums}
    .up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--faint)}
    .gold{color:var(--accent);font-weight:700} .blue{color:var(--blue);font-weight:700}
    .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;background:var(--panel2);color:var(--muted)}
    .tag.ah{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
    .tag.bz{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
    .chg{font-weight:700;font-size:12.5px;white-space:nowrap}

    /* tables */
    .tablecard{overflow:hidden}
    .tscroll{overflow:auto;max-height:calc(100vh - 290px)}
    table{width:100%;border-collapse:collapse}
    th{position:sticky;top:0;background:var(--panel);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none;z-index:1}
    th.sortable{cursor:pointer} th.sortable:hover{color:var(--text)}
    th.num{text-align:right}
    td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
    tbody tr{cursor:pointer}
    tbody tr:hover td{background:var(--hover)}
    tbody tr:last-child td{border-bottom:0}
    td.name{font-weight:650;max-width:340px;overflow:hidden;text-overflow:ellipsis}
    td.name small{display:block;color:var(--faint);font-weight:500;font-size:11.5px}
    .starbtn{border:0;background:none;color:var(--faint);padding:2px}
    .starbtn.on{color:var(--accent)} .starbtn:hover{color:var(--accent)}
    .empty{padding:44px 20px;text-align:center;color:var(--muted)}
    .more{padding:12px;text-align:center}

    /* lists inside dashboard cards */
    .list{display:flex;flex-direction:column}
    .li{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
    .li:last-child{border-bottom:0}
    .li:hover{background:var(--hover)}
    .li .n{flex:1;min-width:0;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .li .p{font-variant-numeric:tabular-nums;color:var(--muted);min-width:64px;text-align:right}

    /* toggle */
    .setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 16px;border-bottom:1px solid var(--line)}
    .setrow:last-child{border-bottom:0}
    .setrow b{display:block} .setrow span{color:var(--muted);font-size:13px}
    .switch{position:relative;width:44px;height:25px;border-radius:20px;background:var(--line2);border:0;flex-shrink:0;transition:.15s}
    .switch::after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.15s}
    .switch.on{background:var(--green)} .switch.on::after{left:22px}

    /* drawer */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s;z-index:40}
    .overlay.on{opacity:1;pointer-events:auto}
    .drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .22s ease;z-index:50;display:flex;flex-direction:column}
    .drawer.on{transform:none}
    .d-head{display:flex;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
    .d-head h2{font-size:18px;margin-bottom:6px}
    .d-body{padding:20px;overflow-y:auto;flex:1}
    .price-big{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 14px}
    .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
    .kv div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
    .kv small{display:block;color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
    .kv b{font-size:16px}
    .chartbox{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px}
    .chartbox svg{display:block;width:100%;height:auto}
    .tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:var(--shadow);transform:translate(-50%,-120%);white-space:nowrap;display:none}
    .alertbox{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:10px}
    .alertbox label{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:4px}

    /* toasts */
    .toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:60}
    .toast{background:var(--panel);border:1px solid var(--line2);border-left:4px solid var(--accent);padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);max-width:340px;font-weight:600;animation:in .2s ease}
    .toast.good{border-left-color:var(--green)} .toast.bad{border-left-color:var(--red)}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    @media (max-width:900px){
      .side{position:fixed;inset:0 auto 0 0;transform:translateX(-105%);transition:.2s;box-shadow:var(--shadow)}
      .side.on{transform:none}
      .menu{display:grid}
      #view{padding:16px} .top{padding:10px 14px}
      .pill .t{display:none}
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo">PT</div><div><b>Price Tracker</b><small>Skyblock market</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot" id="sideFoot">Connecting…</div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="icon-btn menu" id="menuBtn" aria-label="Menu"></button>
      <div class="gsearch" id="gs"><input id="gsearch" placeholder="Search items…   press / to focus" autocomplete="off"></div>
      <div class="pill" id="statusPill"><i class="dot" id="dot"></i><span class="t" id="statusText">Connecting…</span></div>
      <div id="userBox" style="display:flex;align-items:center;gap:8px"></div>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"></button>
    </header>
    <main id="view"></main>
  </div>
</div>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toasts" id="toasts"></div>

<script>
  'use strict';
  /* =============== helpers =============== */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const ICON = {
    dashboard:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
    market:'<path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.3 2.3a1 1 0 0 0 .7 1.7H17"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>',
    trend:'<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
    flips:'<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
    star:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
    calc:'<rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="8" y2="10.01"/><line x1="12" y1="10" x2="12" y2="10.01"/><line x1="16" y1="10" x2="16" y2="10.01"/><line x1="8" y1="14" x2="8" y2="14.01"/><line x1="12" y1="14" x2="12" y2="14.01"/><line x1="16" y1="14" x2="16" y2="14.01"/><line x1="8" y1="18" x2="16" y2="18"/>',
    settings:'<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
    search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
    moon:'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
    sun:'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>',
    x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    menu:'<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>',
    down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
    box:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>',
    clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>'
  };
  const ic = (n, s = 18) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

  function fmt(n) {
    if (!n || n <= 0) return '—';
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return Math.round(n).toLocaleString();
  }
  const full = n => Math.round(n).toLocaleString() + ' coins';
  function ago(ms) {
    if (!ms) return '—';
    const s = (Date.now() - ms) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }
  function median(a) {
    if (!a.length) return 0;
    const c = a.slice().sort((x, y) => x - y), m = c.length >> 1;
    return c.length % 2 ? c[m] : (c[m - 1] + c[m]) / 2;
  }
  function trendOf(h) {           // same maths as the in-game GUI
    const n = h.length;
    if (n < 6) return 0;                                   // not enough scans for a real trend
    const r = 3, from = Math.max(0, n - r - 10);
    const recent = median(h.slice(n - r)), base = median(h.slice(from, n - r));
    if (base < 50) return 0;                               // tiny prices give silly percentages
    return Math.max(-50, Math.min(50, (recent - base) / base * 100));
  }
  const marginOf = i => { if (i.source !== 'BZ' || i.sellPrice < 10 || i.lowestBin < 10) return 0; const m = (i.lowestBin * 0.9875 - i.sellPrice) / i.sellPrice * 100; return (m > 50 || m < 0) ? 0 : m; };  // real flips are small, bigger = bad data
  const keyOf = i => (i.source === 'BZ' ? 'bz:' : '') + i.name.toLowerCase();
  function parseCoins(s) {
    s = String(s || '').trim().toLowerCase().replace(/[, ]/g, '');
    if (!s) return 0;
    let m = 1; const l = s.slice(-1);
    if (l === 'k') m = 1e3; else if (l === 'm') m = 1e6; else if (l === 'b') m = 1e9;
    if (m !== 1) s = s.slice(0, -1);
    const v = parseFloat(s) * m;
    return isFinite(v) && v > 0 ? v : 0;
  }
  function chg(t) {
    if (Math.abs(t) < 0.05) return '<span class="chg flat">—</span>';
    return `<span class="chg ${t > 0 ? 'up' : 'down'}">${t > 0 ? '▲' : '▼'} ${Math.abs(t).toFixed(1)}%</span>`;
  }
  function spark(h, w = 84, ht = 24) {
    if (!h || h.length < 2) return '<span class="faint">—</span>';
    h = h.slice(-30);
    const min = Math.min(...h), max = Math.max(...h), r = (max - min) || 1;
    const pts = h.map((v, i) => (i * (w / (h.length - 1))).toFixed(1) + ',' + (ht - 2 - ((v - min) / r) * (ht - 4)).toFixed(1)).join(' ');
    const col = h[h.length - 1] >= h[0] ? 'var(--green)' : 'var(--red)';
    return `<svg width="${w}" height="${ht}" viewBox="0 0 ${w} ${ht}"><polyline fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" points="${pts}"/></svg>`;
  }
  function toast(msg, kind) {
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.textContent = msg;

  let TOKEN = localStorage.getItem('pt_token') || '', ME = null;   // signed-in Google account (website only)
  async function localPost(path, b) {
    if (TOKEN && path === '/api/watch') {
      try {
        const r = await fetch('/api/me/watch', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN }, body: JSON.stringify(b) });
        if (r.status === 401) { signOut(); return { ok: false }; }
        const j = await r.json(); if (j.watch && ME) ME.watch = j.watch; return j;
      } catch (e) { return { ok: false }; }
    }
    if (path === '/api/watch') {
      const w = LS.get('pt_watch', {}); const c = w[b.key] || { watched: false, above: 0, below: 0 };
      if (b.watched !== undefined) { c.watched = !!b.watched; if (!c.watched) { c.above = 0; c.below = 0; } }
      if (b.above !== undefined) c.above = Math.max(0, b.above || 0);

      if ((b.above !== undefined || b.below !== undefined) && (c.above > 0 || c.below > 0) && b.watched !== false) c.watched = true;
      if (c.watched) w[b.key] = c; else delete w[b.key];
      LS.set('pt_watch', w); return { ok: true };
    }
    if (path === '/api/settings') { const st = LS.get('pt_settings', {}); st[b.key] = !!b.value; LS.set('pt_settings', st); return { ok: true }; }
    return { ok: true, removed: 0 };
  }
  function applyLocal(items, st) {
    const w = (TOKEN && ME) ? ME.watch : LS.get('pt_watch', {}); let n = 0;

        const rows = S.items.map(i => [i.name, i.source, i._cat, Math.round(i.lowestBin), Math.round(i.sellPrice), Math.round(i.avgPrice), i._trend.toFixed(2), i.history.length, i.lastSeen ? new Date(i.lastSeen).toISOString() : '']
                .map(v => '"' + String(v).replace(/"/g, '""') + '"').join(','));
        download('pricetracker.csv', [head, ...rows].join('\n'), 'text/csv');
      };
      $('#purge').onclick = async () => {
        const r = await post('/api/purge'); if (!r) return;
        toast(r.removed ? `Removed ${r.removed} junk entr${r.removed === 1 ? 'y' : 'ies'}` : 'Nothing to remove', 'good'); refresh();
      };
    },
    update() {
      const st = (S.status && S.status.settings) || {};
      $('#sList').innerHTML = SETTINGS.map(s => `<div class="setrow"><div><b>${s.t}</b><span>${s.d}</span></div>
      <button class="switch ${st[s.k] ? 'on' : ''}" data-k="${s.k}" aria-label="${s.t}"></button></div>`).join('');
      $$('#themeSeg button').forEach(b => b.classList.toggle('on', b.dataset.t === (localStorage.getItem('pt_theme') || 'auto')));
    }
  };

  function download(name, text, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  /* =============== detail drawer =============== */
  function openDrawer(key) {
    const i = byKey(key); if (!i) return;
    S.sel = key;
    const d = $('#drawer');
    d.innerHTML = `<div class="d-head"><div style="min-width:0"><h2>${esc(i.name)}</h2><div class="row">${marketTag(i)}<span class="tag">${esc(i._cat)}</span></div></div>
      <div class="row" style="flex-wrap:nowrap"><button class="icon-btn" id="dStar" title="Watch">${ic('star', 17)}</button><button class="icon-btn" id="dClose" aria-label="Close">${ic('x', 17)}</button></div></div>
    <div class="d-body">
      <div class="muted" style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em">${i.source === 'BZ' ? 'Buy price' : 'Lowest BIN'}</div>
      <div class="price-big" id="dPrice"></div>
      <div class="chartbox" id="dChart"></div>
      <div class="kv" id="dKv"></div>
      <div class="alertbox"><b>Price alerts</b><p class="muted" style="margin:4px 0 12px;font-size:12.5px">Notifies you in game when the price crosses a target. Use k / m / b, e.g. 1.5m.</p>
        <div class="row" style="flex-wrap:nowrap"><div style="flex:1"><label>Alert above</label><input class="field" id="dAbove" style="width:100%"></div>
        <div style="flex:1"><label>Alert below</label><input class="field" id="dBelow" style="width:100%"></div></div>
        <div class="row" style="margin-top:12px"><button class="btn" id="dSave">Save alerts</button><button class="btn ghost" id="dClear">Clear</button></div></div>
    </div>`;
    $('#dAbove').value = i.alertAbove > 0 ? Math.round(i.alertAbove) : '';
    $('#dBelow').value = i.alertBelow > 0 ? Math.round(i.alertBelow) : '';
    $('#dClose').onclick = closeDrawer;
    $('#dStar').onclick = async () => { const c = byKey(S.sel); if (c) { await post('/api/watch', { key: c._key, watched: !c.watched }); await refresh(); } };
    $('#dSave').onclick = async () => {
      const c = byKey(S.sel); if (!c) return;
      await post('/api/watch', { key: c._key, above: parseCoins($('#dAbove').value), below: parseCoins($('#dBelow').value) });
      toast('Alerts saved', 'good'); await refresh();
    };
    $('#dClear').onclick = async () => {
      const c = byKey(S.sel); if (!c) return;
      $('#dAbove').value = $('#dBelow').value = '';
      await post('/api/watch', { key: c._key, above: 0, below: 0 }); await refresh();
    };
    d.classList.add('on'); $('#overlay').classList.add('on'); d.setAttribute('aria-hidden', 'false');
    refreshDrawer();
  }
  function closeDrawer() { S.sel = null; $('#drawer').classList.remove('on'); $('#overlay').classList.remove('on'); $('#drawer').setAttribute('aria-hidden', 'true'); }

  function refreshDrawer() {
    const i = byKey(S.sel); if (!i) return;
    const h = i.history, bz = i.source === 'BZ';
    $('#dPrice').innerHTML = `<span class="gold" title="${full(i.lowestBin)}">${fmt(i.lowestBin)}</span> ${bz ? chg(i._trend) : ''}`;
    $('#dStar').style.color = i.watched ? 'var(--accent)' : '';
    $('#dStar').innerHTML = ic('star', 17).replace('fill="none"', i.watched ? 'fill="currentColor"' : 'fill="none"');
    const hi = Math.max(i.highestBin || 0, h.length ? Math.max(...h) : 0), lo = h.length ? Math.min(...h) : 0;
    const cells = [['Average', fmt(i.avgPrice)], ['Samples', h.length], [bz ? 'Highest seen' : 'Highest BIN', fmt(hi)], [bz ? 'Lowest seen' : 'Lowest BIN', fmt(lo)]];
    if (bz) {
      const profit = i.lowestBin * 0.9875 - i.sellPrice;
      cells.unshift(['Sell price', `<span class="blue">${fmt(i.sellPrice)}</span>`], ['Flip margin', i.sellPrice > 0 ? `<span class="${profit >= 0 ? 'up' : 'down'}">${i._margin.toFixed(1)}%</span>` : '—']);
    }
    cells.push(['Last updated', ago(i.lastSeen)]);
    $('#dKv').innerHTML = cells.map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join('');
    mountChart($('#dChart'), h);
  }

  function mountChart(el, h) {
    if (h.length < 2) { el.innerHTML = '<div class="empty" style="padding:40px 10px">Need at least 2 scans to draw a chart.</div>'; return; }
    const W = Math.max(300, el.clientWidth - 16), H = 210, pl = 54, pr = 10, pt = 12, pb = 22;
    let lo = Math.min(...h), hi = Math.max(...h);
    if (hi === lo) { lo *= .97; hi *= 1.03; }
    const pad = (hi - lo) * .08; lo -= pad; hi += pad;
    const X = i => pl + i * (W - pl - pr) / (h.length - 1), Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
    const up = h[h.length - 1] >= h[0], col = up ? 'var(--green)' : 'var(--red)';
    const line = h.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
    const area = line + ` L${X(h.length - 1).toFixed(1)} ${H - pb} L${X(0).toFixed(1)} ${H - pb} Z`;
    let grid = '';
    for (let g = 0; g <= 4; g++) {
      const v = lo + (hi - lo) * g / 4, y = Y(v).toFixed(1);
      grid += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl - 8}" y="${+y + 4}" text-anchor="end" font-size="11" fill="var(--faint)">${fmt(v)}</text>`;
    }
    const avg = h.reduce((a, b) => a + b, 0) / h.length;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
      <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${up ? '#34d399' : '#f87171'}" stop-opacity=".28"/><stop offset="1" stop-color="${up ? '#34d399' : '#f87171'}" stop-opacity="0"/></linearGradient></defs>
      ${grid}<line x1="${pl}" x2="${W - pr}" y1="${Y(avg).toFixed(1)}" y2="${Y(avg).toFixed(1)}" stroke="var(--blue)" stroke-opacity=".6" stroke-dasharray="6 4"/>
      <path d="${area}" fill="url(#cg)"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="${pl}" y="${H - 5}" font-size="11" fill="var(--faint)">oldest</text><text x="${W - pr}" y="${H - 5}" text-anchor="end" font-size="11" fill="var(--faint)">newest</text>
      <g id="hv" style="display:none"><line id="hl" y1="${pt}" y2="${H - pb}" stroke="var(--muted)" stroke-opacity=".5"/><circle id="hc" r="4.5" fill="${col}" stroke="var(--panel)" stroke-width="2"/></g></svg><div class="tip" id="tip"></div>`;
    const svg = $('svg', el), tip = $('#tip', el), hv = $('#hv', el);
    svg.onmousemove = e => {
      const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * (W / r.width);
      const idx = Math.max(0, Math.min(h.length - 1, Math.round((mx - pl) / ((W - pl - pr) / (h.length - 1)))));
      const x = X(idx), y = Y(h[idx]);
      hv.style.display = ''; $('#hl', el).setAttribute('x1', x); $('#hl', el).setAttribute('x2', x);
      $('#hc', el).setAttribute('cx', x); $('#hc', el).setAttribute('cy', y);
      const prev = idx ? h[idx - 1] : h[idx], d = prev > 0 ? (h[idx] - prev) / prev * 100 : 0;
      tip.style.display = 'block'; tip.style.left = (x / W * r.width + 8) + 'px'; tip.style.top = (y / H * r.height + 8) + 'px';
      tip.innerHTML = `<b>${full(h[idx])}</b><br><span class="muted">Scan #${idx + 1}</span> ${chg(d)}`;
    };
    svg.onmouseleave = () => { hv.style.display = 'none'; tip.style.display = 'none'; };
  }

  /* =============== alerts (browser toasts) =============== */
  function checkAlerts() {
    S.items.forEach(i => {
      if (!i.watched) return;
      [['a', i.alertAbove > 0 && i.lowestBin >= i.alertAbove, `${i.name} rose above ${fmt(i.alertAbove)} (now ${fmt(i.lowestBin)})`],
        ['b', i.alertBelow > 0 && i.lowestBin > 0 && i.lowestBin <= i.alertBelow, `${i.name} fell below ${fmt(i.alertBelow)} (now ${fmt(i.lowestBin)})`]]
              .forEach(([t, hit, msg]) => {
                const k = i._key + t;
                if (hit && !S.fired.has(k)) { S.fired.add(k); if (S.firstLoadDone) toast('🔔 ' + msg); }
                else if (!hit) S.fired.delete(k);
              });
    });
    S.firstLoadDone = true;
  }

  /* =============== shell: nav, routing, theme, polling =============== */
  const NAV = [['dashboard', 'dashboard', 'Dashboard'], ['market', 'market', 'Market'], ['movers', 'trend', 'Movers'], ['flips', 'flips', 'Bazaar flips'],
    ['watch', 'star', 'Watchlist'], ['calc', 'calc', 'Chest calculator'], ['settings', 'settings', 'Settings']];

  function renderNav() {
    const st = S.status || {};
    $('#nav').innerHTML = '<div class="navsec">Overview</div>' + NAV.map(([id, icn, label], idx) =>
            (id === 'calc' ? '<div class="navsec">Tools</div>' : '') +
            `<button class="nav ${S.view === id ? 'on' : ''}" data-v="${id}">${ic(icn)} ${label}${
                    id === 'market' && st.total ? `<span class="badge">${st.total}</span>` : id === 'watch' && st.watched ? `<span class="badge">${st.watched}</span>` : ''}</button>`).join('');
  }
  $('#nav').onclick = e => { const b = e.target.closest('.nav'); if (b) { location.hash = '#/' + b.dataset.v; $('#side').classList.remove('on'); } };

  function route() {
    const v = (location.hash.replace(/^#\/?/, '') || 'dashboard');
    S.view = VIEWS[v] ? v : 'dashboard';
    closeDrawer();
    VIEWS[S.view].mount($('#view'));
    renderNav();
    VIEWS[S.view].update();
    document.title = VIEWS[S.view].title + ' · Price Tracker';
    $('#view').scrollTop = 0;
  }
  window.addEventListener('hashchange', route);

  $('#view').addEventListener('click', e => {
    const star = e.target.closest('[data-star]');
    if (star) { e.stopPropagation(); const i = byKey(star.dataset.star); if (i) post('/api/watch', { key: i._key, watched: !i.watched }).then(refresh); return; }
    if (e.target.closest('button,input,select,textarea,a')) return;
    const o = e.target.closest('[data-open]'); if (o) openDrawer(o.dataset.open);
  });
  $('#overlay').onclick = closeDrawer;
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDrawer();
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#gsearch').focus(); }
  });
  $('#gsearch').oninput = e => {
    S.q = e.target.value; S.limit = 200;
    if (S.view !== 'market' && S.view !== 'flips') location.hash = '#/market'; else VIEWS[S.view].update();
  };
  $('#gs').insertAdjacentHTML('afterbegin', ic('search', 16));
  $('#menuBtn').innerHTML = ic('menu'); $('#menuBtn').onclick = () => $('#side').classList.toggle('on');

  function setTheme(t) {
    localStorage.setItem('pt_theme', t);
    const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    $('#themeBtn').innerHTML = ic(dark ? 'sun' : 'moon');
  }
  $('#themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  try { setTheme(localStorage.getItem('pt_theme') || 'auto'); } catch (e) { setTheme('dark'); }

  function renderStatus() {
    const st = S.status;
    $('#dot').classList.toggle('live', S.online);
    let txt, foot;
    if (!S.online) { txt = 'Disconnected'; foot = 'Start Minecraft with the mod to see live data.'; }
    else if (st && !st.settings.scan) { txt = 'Scanning paused'; foot = `${st.total} items · scan is OFF`; }
    else { txt = st && st.lastScan ? 'Live · scanned ' + ago(st.lastScan) : 'Live · waiting for a scan'; foot = `${st ? st.total : 0} items tracked`; }
    $('#statusText').textContent = txt; $('#sideFoot').textContent = foot;
    const old = $('#offline');
    if (!S.online && !old) $('#view').insertAdjacentHTML('afterbegin', '<div class="banner" id="offline">Can’t reach the server. If it was asleep, wait a minute and it will reconnect.</div>');
    if (S.online && old) old.remove();
  }

  let busy = false;
  async function refresh() {
    if (busy) return; busy = true;
    try {
      const [p, st] = await Promise.all([fetch('/api/prices').then(r => r.json()), fetch('/api/status').then(r => r.json())]);
      if (REMOTE) applyLocal(p.map(i => Object.assign(i, { _t: 0 })), st); S.items = p; prepare(S.items); S.status = st; S.online = true;
    } catch (e) { S.online = false; }
    busy = false;
    renderStatus();
    if (S.online) {
      renderNav(); checkAlerts();
      const active = document.activeElement;
      if (!(active && active.closest('#view') && /INPUT|TEXTAREA/.test(active.tagName) && S.view !== 'market')) VIEWS[S.view].update();
      if (S.sel) refreshDrawer();
    }
  }
  route();
  refresh();
  setInterval(refresh, 3000);

  // ---- Google sign-in (website only): each account keeps its own watchlist + alerts, prices stay shared ----
  function drawUser() {
    const b = document.getElementById('userBox'); if (!b) return;
    if (ME) {
      b.innerHTML = '<span class="pill" title="' + ME.email + '"><span class="t">' + (ME.name || ME.email).split(' ')[0] + '</span></span>' +
        (ME.admin ? '<a href="/admin" class="pill"><span class="t">Admin</span></a>' : '') + '<button class="pill" id="soBtn"><span class="t">Sign out</span></button>';
      document.getElementById('soBtn').onclick = signOut;
    } else b.innerHTML = '<div id="gBtn"></div>';
  }
  function signOut() { TOKEN = ''; ME = null; localStorage.removeItem('pt_token'); drawUser(); startGoogle(); refresh(); }
  async function onGoogle(resp) {
    try {
      const r = await fetch('/api/login/google', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credential: resp.credential, merge: LS.get('pt_watch', {}) }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.error);
      TOKEN = j.token; ME = j.user; localStorage.setItem('pt_token', TOKEN); drawUser(); refresh();
    } catch (e) { alert(e.message); }
  }
  function startGoogle() {
    if (ME || !window.google || !window.__gid) return;
    google.accounts.id.initialize({ client_id: window.__gid, callback: onGoogle });
    const el = document.getElementById('gBtn'); if (el) google.accounts.id.renderButton(el, { theme: 'outline', size: 'medium', text: 'signin_with' });
  }
  async function initAuth() {
    if (!REMOTE) return;
    try {
      const c = await (await fetch('/api/config')).json(); if (!c.enabled) return;
      window.__gid = c.googleClientId;
      if (TOKEN) { const r = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + TOKEN } }); if (r.ok) ME = await r.json(); else { TOKEN = ''; localStorage.removeItem('pt_token'); } }
      drawUser();
      if (!ME) { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = startGoogle; document.head.appendChild(s); }
      else refresh();
    } catch (e) { /* sign-in is optional */ }
  }
  initAuth();
</script>
</body>
</html>
